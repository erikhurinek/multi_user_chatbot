services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -hf Qwen/Qwen3-8B-GGUF:Q4_K_M
      --host 0.0.0.0 --port 8080
      -c 4096 -np 1 -t 4 --jinja --reasoning off
    environment:
      LLAMA_CACHE: /models
      SYSTEM_PROMPT_FILE: /config/system_prompt.txt
    volumes:
      - models:/models
      - ./config/system_prompt.txt:/config/system_prompt.txt:ro
    restart: unless-stopped

  chat:
    build: .
    environment:
      LLAMA_URL: http://llama:8080
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - data:/data
    depends_on:
      - llama
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
    restart: unless-stopped

volumes:
  models:
  data:
