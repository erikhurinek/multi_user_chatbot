[package]
name = "multi_user_chatbot"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
futures-util = "0.3.34"
tokio-stream = "0.1.19"
anyhow = "1.0.104"
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "fs"] }
async-stream = "0.3.6"
rand = "0.10.3"
toml = "1.1.8"

[dev-dependencies]
tokio-stream = "0.1.19"
